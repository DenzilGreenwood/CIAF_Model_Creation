name: Build & Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'ciaf/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'Dockerfile*'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      backend-image: ${{ steps.meta-backend.outputs.tags }}
      frontend-image: ${{ steps.meta-frontend.outputs.tags }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      continue-on-error: true

    - name: Extract metadata (backend)
      id: meta-backend
      uses: docker/metadata-action@v4
      with:
        images: ${{ secrets.DOCKER_HUB_USERNAME }}/ciaf-backend
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build backend image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile.backend
        push: false
        tags: ciaf-backend:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Extract metadata (frontend)
      id: meta-frontend
      uses: docker/metadata-action@v4
      with:
        images: ${{ secrets.DOCKER_HUB_USERNAME }}/ciaf-frontend
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build frontend image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: false
        tags: ciaf-frontend:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-staging:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: success()
    environment:
      name: staging
      url: https://staging.ciaf.example.com

    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
      if: secrets.AWS_ACCESS_KEY_ID != ''
      continue-on-error: true

    - name: Deploy to staging (via Docker Swarm)
      run: |
        echo "Deploying to staging environment..."
        # Add your deployment commands here
        # Examples:
        # - Push images to registry
        # - Update staging stack
        # - Run health checks
      continue-on-error: true

    - name: Run smoke tests
      run: |
        echo "Running smoke tests against staging..."
        # Add your smoke test commands here
      continue-on-error: true

    - name: Notify deployment status
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        text: 'Staging deployment ${{ job.status }}'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author,action,eventName,ref
      continue-on-error: true

  notify-results:
    runs-on: ubuntu-latest
    needs: [build-and-test, deploy-staging]
    if: always()
    steps:
    - name: Send GitHub notification
      uses: actions/github-script@v7
      with:
        script: |
          const buildStatus = '${{ needs.build-and-test.result }}';
          const deployStatus = '${{ needs.deploy-staging.result }}';

          const message = `
          ## CI/CD Pipeline Status

          - **Build**: ${buildStatus === 'success' ? '✅' : '❌'} ${buildStatus}
          - **Staging Deploy**: ${deployStatus === 'success' ? '✅' : '❌'} ${deployStatus}

          [View workflow details](${context.payload.repository.html_url}/actions/runs/${context.runId})
          `;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: message
          }).catch(err => console.log('Could not post comment (may not be a PR)'));
