[pytest]
# Pytest configuration for CIAF Vault API tests

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:warnings

# Asyncio mode
asyncio_mode = auto

# Markers for test organization
markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
    integration: marks tests as integration tests
    api: marks tests as API tests
    unit: marks tests as unit tests
    slow: marks tests as slow
    auth: marks tests related to authentication
    smoke: marks smoke tests

# Coverage options
[coverage:run]
branch = True
source = ciaf
omit =
    */tests/*
    */test_*.py
    setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

precision = 2
show_missing = True

[coverage:html]
directory = htmlcov

[coverage:xml]
output = coverage.xml
