
services:
  # PostgreSQL Database for Proof Store
  postgres:
    image: postgres:14-alpine
    container_name: ciaf-postgres
    environment:
      POSTGRES_DB: ciaf_proofs
      POSTGRES_USER: ${DB_USER:-ciaf_verification}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      # Mount schema file
      - ./ciaf/verification/POSTGRESQL_SCHEMA.py:/docker-entrypoint-initdb.d/01-schema.sql
      # Persistent data volume
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ciaf_verification -d ciaf_proofs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ciaf-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis Cache (Optional but recommended for production)
  redis:
    image: redis:7-alpine
    container_name: ciaf-redis
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ciaf-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # CIAF Verification Microservice
  verification-service:
    build:
      context: .
      dockerfile: ciaf/verification/Dockerfile
    container_name: ciaf-verification
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-ciaf_verification}:${DB_PASSWORD:?Database password required}@postgres:5432/ciaf_proofs
      DB_ECHO: "false"

      # Redis Cache
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CACHE_TTL: "300"  # 5 minutes

      # Service
      SERVICE_HOST: 0.0.0.0
      SERVICE_PORT: 8001

      # Security
      API_KEY_SECRET: ${API_KEY_SECRET:?API key secret required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT secret key required}
      ENVIRONMENT: ${ENVIRONMENT:-development}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json

      # CIAF Core Integration
      CIAF_CORE_URL: http://ciaf-core:8000
      CIAF_API_KEY: ${CIAF_API_KEY:?CIAF API key required}

      # Performance
      POOL_SIZE: "10"
      MAX_OVERFLOW: "5"
      POOL_RECYCLE: "3600"

      # Timeouts
      QUERY_TIMEOUT: "30"
      VERIFICATION_TIMEOUT: "5"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Mount source code for development
      - ./ciaf:/app/ciaf
      - ./ciaf/verification:/app/verification-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - ciaf-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # CIAF Core API (Optional - for full integration testing)
  ciaf-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ciaf-core
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-ciaf_user}:${DB_PASSWORD:?Database password required}@postgres:5432/ciaf_main
      VERIFICATION_SERVICE_URL: http://verification-service:8001
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./ciaf:/app/ciaf
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - ciaf-network
    profiles:
      - full-stack
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # pgAdmin Web UI (Optional - for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ciaf-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ciaf.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?pgAdmin password required}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - ciaf-network
    profiles:
      - debug
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Prometheus Monitoring (Optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: ciaf-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - verification-service
    networks:
      - ciaf-network
    profiles:
      - monitoring
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
  prometheus_data:
    driver: local

networks:
  ciaf-network:
    driver: bridge
