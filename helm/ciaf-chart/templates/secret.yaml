---
# Note: Secrets should be managed externally (Sealed Secrets, External Secrets Operator, etc.)
# This is a template only - DO NOT store actual secrets here
apiVersion: v1
kind: Secret
metadata:
  name: ciaf-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    app: ciaf
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
type: Opaque
stringData:
  # Database credentials
  postgres_user: {{ .Values.postgresql.username | quote }}
  postgres_db: {{ .Values.postgresql.database | quote }}
  # Passwords should be set via --set-string or external secret management
  # postgres_password: ""
  # jwt_secret_key: ""
  # api_key_secret: ""
  # vault_master_key: ""
