apiVersion: apps/v1
kind: Deployment
metadata:
  name: ciaf-core
  namespace: ciaf
  labels:
    app: ciaf-core
    component: backend
    tier: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rolling Update:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ciaf-core
  template:
    metadata:
      labels:
        app: ciaf-core
        component: backend
        tier: api
    spec:
      serviceAccountName: ciaf-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: ciaf-core
        image: ciaf-core:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: ciaf-config
              key: log_level
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ciaf-db-credentials
              key: database_url_main
        - name: VERIFICATION_SERVICE_URL
          value: "http://ciaf-verification:8001"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - ciaf-core
              topologyKey: kubernetes.io/hostname
