apiVersion: apps/v1
kind: Deployment
metadata:
  name: ciaf-verification
  namespace: ciaf
  labels:
    app: ciaf-verification
    component: backend
    tier: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ciaf-verification
  template:
    metadata:
      labels:
        app: ciaf-verification
        component: backend
        tier: api
    spec:
      serviceAccountName: ciaf-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: verification
        image: ciaf-verification:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8001
          protocol: TCP
        env:
        - name: SERVICE_HOST
          value: "0.0.0.0"
        - name: SERVICE_PORT
          value: "8001"
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: ciaf-config
              key: log_level
        - name: LOG_FORMAT
          value: "json"
        # Database connection
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ciaf-db-credentials
              key: database_url
        - name: DB_ECHO
          value: "false"
        - name: POOL_SIZE
          value: "10"
        - name: MAX_OVERFLOW
          value: "5"
        - name: POOL_RECYCLE
          value: "3600"
        # Redis cache
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: ciaf-db-credentials
              key: redis_url
        - name: CACHE_TTL
          value: "300"
        # Security
        - name: API_KEY_SECRET
          valueFrom:
            secretKeyRef:
              name: ciaf-api-keys
              key: api_key_secret
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ciaf-api-keys
              key: jwt_secret_key
        # CIAF Core Integration
        - name: CIAF_CORE_URL
          value: "http://ciaf-core:8000"
        - name: CIAF_API_KEY
          valueFrom:
            secretKeyRef:
              name: ciaf-api-keys
              key: ciaf_api_key
        # Timeouts
        - name: QUERY_TIMEOUT
          value: "30"
        - name: VERIFICATION_TIMEOUT
          value: "5"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/cache
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - ciaf-verification
              topologyKey: kubernetes.io/hostname
