---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ciaf-ingress
  namespace: ciaf
  labels:
    app: ciaf
    component: ingress
  annotations:
    # Nginx Ingress Controller annotations
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"  # For automatic TLS certificates
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
    
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    
    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    
    # Request size limits
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
  - hosts:
    - ciaf.example.com  # TODO: Replace with your actual domain
    - api.ciaf.example.com
    secretName: ciaf-tls-cert  # TLS certificate secret (managed by cert-manager)
  
  rules:
  # Main web interface
  - host: ciaf.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ciaf-nginx
            port:
              number: 80
  
  # API endpoints
  - host: api.ciaf.example.com
    http:
      paths:
      # Vault API
      - path: /vault
        pathType: Prefix
        backend:
          service:
            name: ciaf-vault
            port:
              number: 8000
      
      # Verification API
      - path: /verify
        pathType: Prefix
        backend:
          service:
            name: ciaf-verification
            port:
              number: 8001
      
      # Health check endpoint
      - path: /health
        pathType: Exact
        backend:
          service:
            name: ciaf-vault
            port:
              number: 8000
