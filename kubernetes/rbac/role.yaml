---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ciaf-role
  namespace: ciaf
  labels:
    app: ciaf
    component: rbac
rules:
# Allow reading ConfigMaps and Secrets
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]

# Allow reading pod information (for health checks)
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]

# Allow reading services (for service discovery)
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch"]

# Allow reading endpoints (for load balancing)
- apiGroups: [""]
  resources: ["endpoints"]
  verbs: ["get", "list", "watch"]
---
# Monitoring role for Prometheus
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ciaf-monitoring-role
  namespace: ciaf
  labels:
    app: ciaf
    component: monitoring
rules:
# Allow reading all resources for monitoring
- apiGroups: [""]
  resources: ["*"]
  verbs: ["get", "list", "watch"]

# Allow reading metrics
- apiGroups: ["metrics.k8s.io"]
  resources: ["*"]
  verbs: ["get", "list"]
