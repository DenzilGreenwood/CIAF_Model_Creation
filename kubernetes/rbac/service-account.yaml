---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ciaf-service-account
  namespace: ciaf
  labels:
    app: ciaf
    component: rbac
automountServiceAccountToken: true
---
# Service account for monitoring components (Prometheus, Grafana)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ciaf-monitoring
  namespace: ciaf
  labels:
    app: ciaf
    component: monitoring
automountServiceAccountToken: true
