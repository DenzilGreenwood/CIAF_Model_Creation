---
# NOTE: This is a template file. In production, use Sealed Secrets or external secret management.
# To create: kubectl create secret generic ciaf-api-keys --from-literal=... --dry-run=client -o yaml > api-keys.yaml
# Then encrypt: kubeseal < api-keys.yaml > api-keys-sealed.yaml
apiVersion: v1
kind: Secret
metadata:
  name: ciaf-api-keys
  namespace: ciaf
  labels:
    app: ciaf
    component: security
type: Opaque
stringData:
  # JWT Secret for token signing (MUST be changed in production)
  jwt_secret_key: CHANGE_ME_GENERATE_RANDOM_256_BIT_KEY  # openssl rand -hex 32
  
  # API Key Secret for internal service authentication
  api_key_secret: CHANGE_ME_GENERATE_RANDOM_256_BIT_KEY  # openssl rand -hex 32
  
  # CIAF API Key for service-to-service communication
  ciaf_api_key: CHANGE_ME_GENERATE_RANDOM_API_KEY  # openssl rand -base64 32
  
  # Vault Master Key (for encryption at rest)
  vault_master_key: CHANGE_ME_GENERATE_RANDOM_256_BIT_KEY  # openssl rand -hex 32
  
  # HashiCorp Vault Token (if using external Vault)
  vault_token: ""  # Leave empty if not using HashiCorp Vault
  
  # Webhook Secret for GitHub/GitLab integrations (optional)
  webhook_secret: ""
