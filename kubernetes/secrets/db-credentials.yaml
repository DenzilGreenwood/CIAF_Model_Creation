---
# NOTE: This is a template file. In production, use Sealed Secrets or external secret management.
# To create: kubectl create secret generic ciaf-db-credentials --from-literal=... --dry-run=client -o yaml > db-credentials.yaml
# Then encrypt: kubeseal < db-credentials.yaml > db-credentials-sealed.yaml
apiVersion: v1
kind: Secret
metadata:
  name: ciaf-db-credentials
  namespace: ciaf
  labels:
    app: ciaf
    component: database
type: Opaque
stringData:
  # PostgreSQL Credentials (Base64 encode these values in production)
  postgres_user: ciaf_verification
  postgres_password: CHANGE_ME_IN_PRODUCTION  # TODO: Replace with actual password
  postgres_db: ciaf_proofs
  
  # Database URL (constructed from above)
  database_url: postgresql+asyncpg://ciaf_verification:CHANGE_ME_IN_PRODUCTION@ciaf-postgresql:5432/ciaf_proofs
  
  # Redis Password (if authentication enabled)
  redis_password: ""  # Empty if no auth, otherwise set password
  
  # Redis URL
  redis_url: redis://ciaf-redis:6379/0
