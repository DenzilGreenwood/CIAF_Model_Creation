---
apiVersion: v1
kind: Service
metadata:
  name: ciaf-postgresql
  namespace: ciaf
  labels:
    app: ciaf-postgresql
    component: database
    tier: data
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgresql
  selector:
    app: ciaf-postgresql
