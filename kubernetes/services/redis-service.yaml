---
apiVersion: v1
kind: Service
metadata:
  name: ciaf-redis
  namespace: ciaf
  labels:
    app: ciaf-redis
    component: cache
    tier: data
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: ciaf-redis
