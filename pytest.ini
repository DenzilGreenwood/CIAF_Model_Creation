[pytest]
# Pytest configuration for CIAF tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Coverage settings (coverage options removed - add manually when running tests)
addopts =
    -v
    --strict-markers
    --tb=short

# Coverage thresholds
[coverage:run]
branch = True
source = ciaf

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

# Minimum coverage requirements
fail_under = 80

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    performance: Performance benchmarks
    e2e: End-to-end tests
    slow: Slow tests
    auth: Authentication tests
    verification: Verification/LCM tests
    api: API endpoint tests

# Timeouts (optional, requires pytest-timeout)
timeout = 300

# Output options
console_output_style = progress
